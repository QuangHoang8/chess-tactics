services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: chess_tactics
      POSTGRES_PASSWORD: chess_tactics
      POSTGRES_DB: chess_tactics
    ports:
      - "5432:5432"
    volumes:
      - chess-tactics-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess_tactics -d chess_tactics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  chess-tactics-postgres-data:
