name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Syntax/shape only -- schema validate and client generate never connect.
      DATABASE_URL: "postgresql://chess_tactics:chess_tactics@localhost:5432/chess_tactics?schema=public"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --schema prisma/schema.prisma

      - run: pnpm db:generate

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

# A Postgres service container and `prisma migrate deploy` against it are added once
# an integration test (plan §6, "API (integration, ...)") actually needs a live database.
