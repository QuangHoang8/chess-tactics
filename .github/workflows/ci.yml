name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      - name: Validate Prisma schema
        run: pnpm exec prisma validate --schema prisma/schema.prisma

# A Postgres service container and `prisma migrate deploy` against it are added once
# Phase 1 introduces the first integration tests (plan §6, "API (integration, ...)").
